name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Scan output (optional)
      description: |
        Output of `/Applications/PortPilot.app/Contents/MacOS/PortPilot --dump` for the affected port.
        Remove anything private (paths, project names) before pasting.
      render: json
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4 (Apple Silicon)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PortPilot version
      description: Shown in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
