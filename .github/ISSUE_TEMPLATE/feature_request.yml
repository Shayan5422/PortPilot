name: Feature request
description: Suggest an idea for PortPilot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like PortPilot to do?
    validations:
      required: true
